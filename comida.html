<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria</title>
  <link rel="stylesheet" href="comida.css">
</head>
<body>
  <h1>Comida Rapida</h1>

  <section class="productos">
    <article class="producto" data-nombre="hamburguesa" data-precio="5000">
      <img src="imagen 1.jpg" alt="hamburguesa">
      <h3>hamburguesa</h3>
      <p>$ 5000</p>
      <button>Comprar</button>
    </article>
    <article class="producto" data-nombre="Pizza" data-precio="9000">
      <img src="imagen 2.jpg" alt="Pizza">
      <h3>Pizza</h3>
      <p>$ 9000</p>
      <button>Comprar</button>
    </article>
    <article class="producto" data-nombre="salchipapas" data-precio="2000">
      <img src="images.3.jpg" alt="salchipapas">
      <h3>salchipapas</h3>
      <p>$ 5500</p>
      <button>Comprar</button>
    </article>
    <article class="producto" data-nombre="perro caliente" data-precio="5000">
      <img src="images.4.jpg" alt="perro caliente">
      <h3>perro caliente</h3>
      <p>$ 5000</p>
      <button>Comprar</button>
    </article>
    <article class="producto" data-nombre="empanada" data-precio="2000">
      <img src="images.5.jpg" alt="empanada">
      <h3>empanada</h3>
      <p>$ 4000</p>
      <button>Comprar</button>
    </article>
    <article class="producto" data-nombre="arepa de huevo" data-precio="3500">
      <img src="images.6.jpg" alt="arepa de huevo">
      <h3>arepa de huevo</h3>
      <p>$ 3500</p>
      <button>comprar</button>
    </article>
    <article class="producto" data-nombre="dona" data-precio="3500">
      <img src="imagen de dona.jpg" alt="arepa de huevo">
      <h3>dona</h3>
      <p>$ 3500</p>
      <button>comprar</button>
    </article>
<article class="producto" data-nombre="pollo" data-precio="3500">
      <img src="pollo.jpg" alt="pollo">
      <h3>pollo</h3>
      <p>$ 3500</p>
      <button>comprar</button>
    </article>
  </section>
<article class="producto" data-nombre="tacos" data-precio="6000">
      <img src="tacos.jpg" alt="tacos">
      <h3>tacos</h3>
      <p>$ 6000</p>
      <button>comprar</button>
    </article>
    <article class="producto" data-nombre="burritos" data-precio="6700">
      <img src="burritos.jpg" alt="burritos">
      <h3>tacos</h3>
      <p>$ 6700</p>
      <button>comprar</button>
    </article>
  <section class="carrito">
    <h2>Carrito de compras</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Item</th>
          <th>Cantidad</th>
          <th>Acción</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="5">Carrito vacío - comience a comprar!</td>
        </tr>
      </tbody>
    </table>
    <h3 id="totalGeneral">Total: $0</h3>
  </section>
  <script src="comida.js"></script>
</body>
</html>
